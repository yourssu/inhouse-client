name: deploy-pages-prod

# 수동 실행 전용: GitHub Actions UI 에서 브랜치를 고르면 해당 브랜치 기준으로 prod 에 전체 배포해요.
on:
  workflow_dispatch:

concurrency:
  group: deploy-pages-prod
  cancel-in-progress: false

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: gen
        run: |
          matrix=$(pnpm tsx scripts/deploy-targets.ts --env=prod)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  deploy:
    needs: targets
    if: ${{ needs.targets.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: write build env to .env.production.local
        if: ${{ matrix.target.envFile != '' }}
        env:
          ENV_FILE: ${{ matrix.target.envFile }}
        run: printf '%s\n' "$ENV_FILE" > apps/${{ matrix.target.app }}/.env.production.local

      - name: build
        env:
          VITE_SCOUTER_MIXPANEL_TOKEN: ${{ vars.SCOUTER_MIXPANEL_TOKEN }}
        run: pnpm exec turbo build --filter=@yourssu-inhouse/${{ matrix.target.app }}

      - name: strip standalone preview (remotes only)
        if: ${{ !matrix.target.isShell }}
        run: |
          rm -f apps/${{ matrix.target.app }}/dist/index.html
          rm -f apps/${{ matrix.target.app }}/dist/mockServiceWorker.js

      - name: deploy to Cloudflare Pages
        run: |
          pnpm dlx wrangler@latest pages deploy apps/${{ matrix.target.app }}/dist \
            --project-name=${{ matrix.target.project }} \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
