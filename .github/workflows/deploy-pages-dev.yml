name: deploy-pages-dev

# main push → dev 자동 배포. workflow_dispatch 로 수동 리런도 dev.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pages-dev
  cancel-in-progress: false

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - id: resolve-base
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE" ]; then
              echo "base=" >> "$GITHUB_OUTPUT"
            else
              echo "base=$BEFORE" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "base=" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: gen
        run: |
          ARGS="--env=dev"
          BASE="${{ steps.resolve-base.outputs.base }}"
          if [ -n "$BASE" ]; then ARGS="$ARGS --base=$BASE"; fi
          matrix=$(pnpm tsx scripts/deploy-targets.ts $ARGS)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  deploy:
    needs: targets
    if: ${{ needs.targets.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: write build env to .env.production.local
        if: ${{ matrix.target.envFile != '' }}
        env:
          ENV_FILE: ${{ matrix.target.envFile }}
        run: printf '%s\n' "$ENV_FILE" > apps/${{ matrix.target.app }}/.env.production.local

      - name: build
        env:
          VITE_SCOUTER_MIXPANEL_TOKEN: ${{ vars.SCOUTER_MIXPANEL_TOKEN }}
        run: pnpm exec turbo build --filter=@yourssu-inhouse/${{ matrix.target.app }}

      - name: strip standalone preview (remotes only)
        if: ${{ !matrix.target.isShell }}
        run: |
          rm -f apps/${{ matrix.target.app }}/dist/index.html
          rm -f apps/${{ matrix.target.app }}/dist/mockServiceWorker.js

      - name: deploy to Cloudflare Pages
        run: |
          pnpm dlx wrangler@latest pages deploy apps/${{ matrix.target.app }}/dist \
            --project-name=${{ matrix.target.project }} \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
